name: Affiliate LIVE Scheduler - Safe Dry Run
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scheduler-safety-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run dry-run worker (never writes campaign status)
        run: python -m affiliate_scheduler.runner
      - name: Run campaign safety tests
        run: python -m unittest discover -s tests -p 'test_affiliate_safety.py'
